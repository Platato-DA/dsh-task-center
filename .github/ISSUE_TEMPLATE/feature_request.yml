name: Feature request / 功能建议
description: Explain a workflow the project could support / 描述希望支持的使用场景
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Use case / 使用场景
      description: What are you trying to do, and what is difficult today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Desired behavior / 期望行为
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and constraints / 替代方案与约束
